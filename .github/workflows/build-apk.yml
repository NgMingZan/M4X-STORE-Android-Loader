      - name: Find APK
        run: |
          echo "===== APK files ====="
          find "$GITHUB_WORKSPACE" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: M4X-STORE-APK
          path: |
            app/build/outputs/apk/**/*.apk
          if-no-files-found: error
